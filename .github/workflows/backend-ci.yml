name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gates:
    name: backend-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_NAME: student_management_saas
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      DJANGO_SETTINGS_MODULE: config.settings.test_postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: student_management_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_management_saas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/development.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements/development.txt

      - name: Verify PostgreSQL connection
        working-directory: backend
        run: >-
          python manage.py shell -c
          "from django.db import connection; connection.ensure_connection();
          assert connection.vendor == 'postgresql';
          print('Connected to PostgreSQL database:', connection.settings_dict['NAME'])"

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check .

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check .

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check migration consistency
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest against PostgreSQL
        working-directory: backend
        run: python -m pytest --ds=config.settings.test_postgres -vv
