[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
